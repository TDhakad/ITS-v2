[project]
name = "capstone-its-v2"
version = "0.1.0"
description = "Conversational IT helpdesk and ticketing system using FastAPI, LangChain, LangGraph, Pydantic, SQLite, and Pinecone."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.136.1",
    "flashrank>=0.2.10",
    "jinja2>=3.1.6",
    "langchain>=1.2.17,<2.0.0",
    "langchain-community>=0.4.1,<0.5.0",
    "langchain-core>=1.3.2,<2.0.0",
    "langchain-groq>=1.1.2,<2.0.0",
    "langchain-openai>=1.2.1,<2.0.0",
    "langchain-nvidia-ai-endpoints>=1.2.1,<2.0.0",
    "langchain-ollama>=1.1.0,<2.0.0",
    "langchain-pinecone>=0.2.13,<0.3.0",
    "langchain-text-splitters>=1.1.2,<2.0.0",
    "langgraph>=1.1.10,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.0.3,<4.0.0",
    "pydantic>=2.13.3,<3.0.0",
    "pydantic-settings>=2.14.0,<3.0.0",
    "posthog>=7.14.0",
    "python-multipart>=0.0.27",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.49,<3.0.0",
    "uvicorn[standard]>=0.46.0",
    "langchain-huggingface>=1.2.2,<2.0.0",
    "sentence-transformers>=5.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
huggingface = [
    "langchain-huggingface>=1.2.2,<2.0.0",
    "sentence-transformers>=5.4.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
