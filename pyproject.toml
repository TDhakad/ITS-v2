[project]
name = "capstone-its-v2"
version = "0.1.0"
description = "Conversational IT helpdesk and ticketing system using FastAPI, LangChain, LangGraph, Pydantic, SQLite, and Pinecone."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "bcrypt>=4.2.1",
    "fastapi>=0.115.6",
    "flashrank>=0.2.10",
    "jinja2>=3.1.5",
    "langchain>=0.3.14,<0.4.0",
    "langchain-community>=0.3.14,<0.4.0",
    "langchain-core>=0.3.29,<0.4.0",
    "langchain-openai>=0.3.11,<0.4.0",
    "langchain-ollama>=0.2.2,<0.3.0",
    "langchain-pinecone>=0.2.13,<0.3.0",
    "langchain-text-splitters>=0.3.4,<0.4.0",
    "langgraph>=0.2.62,<0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.1,<3.0.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "posthog>=3.0.0,<4.0.0",
    "python-multipart>=0.0.20",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
    "langchain-huggingface>=0.1.2,<0.2.0",
    "sentence-transformers>=3.3.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.4",
]
huggingface = [
    "langchain-huggingface>=0.1.2,<0.2.0",
    "sentence-transformers>=3.3.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
